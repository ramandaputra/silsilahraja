---
deployment:
  tasks:
    - env -u GIT_DIR -u GIT_WORK_TREE /usr/bin/git -C /home/silsila2/silsilahraja pull origin main
    - cd /home/silsila2/silsilahraja && /usr/local/bin/php artisan migrate --force
    - cd /home/silsila2/silsilahraja && /usr/local/bin/php artisan optimize:clear
    - /bin/echo "Silsilah Raja Auto-Deploy success!"
